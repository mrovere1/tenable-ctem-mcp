[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenable-ctem-mcp"
version = "0.1.0"
description = "Local (stdio) MCP server delivering the 19 indicators of a CTEM maturity assessment already aggregated, plus MTTR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
keywords = ["mcp", "tenable", "ctem", "exposure-management", "security", "assessment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]


# Dependencia unica: o SDK oficial de MCP.
# O cliente HTTP NAO tem dependencia externa - urllib da stdlib, portado do
# coletor tenable_mttr_export.py 1.1.0, que ja resolve TLS corporativo e backoff.
dependencies = ["mcp>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/mrovere1/tenable-ctem-mcp"
Issues = "https://github.com/mrovere1/tenable-ctem-mcp/issues"

[project.scripts]
tenable-ctem-mcp = "tenable_ctem_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tenable_ctem_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
